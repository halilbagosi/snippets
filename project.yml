name: Snippets
options:
  minimumXcodeGenVersion: 2.45.0
settings:
  base:
    PRODUCT_NAME: Snippets
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 26.0
    ENABLE_DEBUG_DYLIB: NO
    # A real Development team (not ad-hoc "") is REQUIRED for App Intents:
    # macOS refuses to establish the Shortcuts/Siri intent connection to an
    # ad-hoc-signed app ("Shortcuts couldn't communicate with the app").
    DEVELOPMENT_TEAM: KCH5545G6F
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SUPPORTED_PLATFORMS: macosx
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Snippets
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    INFOPLIST_KEY_NSHumanReadableCopyright: ""
targets:
  Snippets:
    type: application
    platform: macOS
    sources:
      - path: Sources/Snippets
        excludes:
          - "Resources/**/*.json"
    resources:
      - path: Sources/Snippets/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halilbagosi.Snippets
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_APP_SANDBOX: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    postBuildScripts: []
schemes:
  Snippets:
    build:
      targets:
        Snippets: all
    run:
      config: Debug
