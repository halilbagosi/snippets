<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
</head>
<body>
<script>
(function(){
    const raw = "func hello() {\n    print(\"world\")\n}";
    const keywords = new Set(["func","var"]);
    const lines = raw.split('\n');
    let html = '';
    for (let i = 0; i < lines.length; i++) {
        const num = i + 1;
        html += '<div class="line">' + num + ' ' + lines[i] + '</div>';
    }
    document.body.insertAdjacentHTML('beforeend', html);
})();
</script>
</body>
</html>
