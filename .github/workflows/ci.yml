# Runner feasibility (plan 007, decided 2026-07-15): the hosted `macos-26`
# arm64 image (github.com/actions/runner-images, macos-26-arm64-Readme.md)
# ships Xcode 26.x (default 26.5) with the macOS 26.x SDKs, which this app
# requires (it targets macOS 26 and SwiftData macros need a full Xcode
# toolchain). The Swift job therefore runs unconditionally on macos-26 with
# the image's default Xcode.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The vendored preview runtimes are inlined into every generated preview and
  # run with 'unsafe-inline'/'unsafe-eval' alongside snippet code, so a silent
  # change to one is a change to what executes in every preview. VENDOR.md is
  # the provenance record; this job is what keeps it honest.
  vendored-runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify vendored runtime checksums
        working-directory: Sources/Snippets/Resources/WebPreview
        run: |
          # VENDOR.md is the source of truth; pull the digest lines straight
          # out of it so the doc cannot drift from the check. Matched by shape
          # rather than by fence position, which survives the doc gaining or
          # losing surrounding code blocks.
          grep -E '^[0-9a-f]{64}  [A-Za-z0-9._-]+$' VENDOR.md > /tmp/vendor.sha256
          test -s /tmp/vendor.sha256 || { echo "No checksums parsed from VENDOR.md"; exit 1; }
          echo "Verifying $(wc -l < /tmp/vendor.sha256) file(s):"
          shasum -a 256 -c /tmp/vendor.sha256

  swift-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # Tests are hosted by the app, so this builds and launches Snippets.app.
      # Signing is skipped: CI has no signing identity, and none is needed to
      # run unit tests locally on the runner.
      - name: Run tests
        run: |
          xcodebuild -project Snippets.xcodeproj \
            -scheme Snippets \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            test

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/design-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/design-system/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
